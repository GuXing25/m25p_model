# M25P40 3V 4Mb Serial NOR Flash model
# memory: 4Mb = 512KiB = 524288 bytes
PAGE_SIZE 256
PAGE_PER_SECTOR 256
SECTOR_COUNT 8
TOTAL_PAGES 2048
MEMORY_SIZE 524288

# SPI timing, unit: MHz / us
# VCC >= 2.7V: fC=75MHz for all commands except READ, fR=33MHz for READ(03h)
F_C_MHZ 75
F_R_MHZ 33
T_SHSL_US 0.1

# Internal self-timed cycles, unit: us
T_W_US 1300
T_W_MAX_US 15000
T_PROG_US 800
T_PROG_MAX_US 5000
T_PROG_CHUNK_US 25
T_ERASE_SECTOR_US 600000
T_ERASE_SECTOR_MAX_US 3000000
T_ERASE_BULK_US 4500000
T_ERASE_BULK_MAX_US 10000000
T_DPD_US 3
T_RES_US 30
T_VSL_US 10
T_PUW_US 10000

# 0=typical timing, 1=maximum timing
USE_MAX_TIME 0

# 0=event-driven WIP/busy model; 1=blocking operation, closer to original simple repo style
AUTO_COMPLETE 0

# 1=address rolls over at 0x7FFFF -> 0x00000
WRAP_ADDRESS 1
STORAGE_FILE storage_m25p.bin
